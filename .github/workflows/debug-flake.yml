name: Debug interface flake

# Temporary: six copies of the interface suite at once, because the WorkbenchWindow failure appears
# only under CI's parallel load. Removed with the probes it exists to exercise.
on:
  push:
    branches: [desktop-fnos-iteration]
    paths:
      - "apps/desktop/src/components/workspace/WorkbenchWindow.spec.ts"
      - ".github/workflows/debug-flake.yml"

jobs:
  repeat:
    name: Suite run ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test