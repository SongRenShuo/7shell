# A quick Windows installer for testing, without the release pipeline.
#
# Dispatch by hand; the run builds the NSIS setup on a single Windows runner and
# uploads it as the run's artifact — no signing, no update channel, no release.
# For a release with every platform, dispatch release.yml with a tag instead.
name: desktop smoke (Windows)

on:
  workflow_dispatch:

concurrency:
  group: desktop-smoke
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (x86_64) NSIS setup
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      # The repository's rust-toolchain.toml pins the toolchain; the target is
      # asked from inside the repository so the two cannot drift.
      - name: Add the msvc target to the pinned toolchain
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-x86_64

      - run: pnpm install --frozen-lockfile

      # A smoke build signs nothing and ships no update channel: the installer
      # is for a person to install by hand and try.
      - name: Build the NSIS setup
        shell: bash
        run: pnpm tauri build --bundles nsis

      - name: Upload the setup
        uses: actions/upload-artifact@v4
        with:
          name: 7Shell-win64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
